# Railway — serviço Web
# Package do monorepo: @nexo/web (o serviço Railway aponta para este nome)
# Root Directory: raiz do monorepo (vazio)
# Preferir Dockerfile: apps/web/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
