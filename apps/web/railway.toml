# Railway — serviço Web
# Root Directory: raiz do monorepo (vazio)
# Build → Dockerfile path: apps/web/Dockerfile
#
# NÃO configure Custom Start com `pnpm --filter @nexo/...`
# (pacotes renomeados para @aion/*). Deixe o CMD do Dockerfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
