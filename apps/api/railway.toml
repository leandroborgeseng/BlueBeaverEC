# Railway — serviço API
# Package do monorepo: @nexo/api (o serviço Railway aponta para este nome)
# Root Directory: raiz do monorepo (vazio)
# Preferir Dockerfile: apps/api/Dockerfile

[build]
builder = "DOCKERFILE"
# Relativo à raiz do repo (Root Directory vazio) e a apps/api (Root Directory = apps/api).
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Fora do cwd: volume no apps/api esconde dist e scripts da imagem.
startCommand = "node /opt/aion-boot/start-api.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# Import one-shot fica no start (IMPORT_ON_BOOT=1). releaseCommand rodava ANTES
# do migrate e derrubava o deploy inteiro se Prisma/import falhasse — 502 no login.
