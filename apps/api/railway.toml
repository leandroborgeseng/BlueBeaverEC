# Railway — serviço API
# Package do monorepo: @nexo/api (o serviço Railway aponta para este nome)
# Root Directory: raiz do monorepo (vazio)
# Preferir Dockerfile: apps/api/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# Wipe+import oficial HEF uma vez (marcador inventario_oficial_hef_v2). Caminho do image.
releaseCommand = "node /app/apps/api/scripts/maybe-import-equipamentos.mjs"
